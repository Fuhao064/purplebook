<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PurpleBook</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="brand-mark">P</span>
      <div class="brand-text">
        <h1>PurpleBook</h1>
        <p>小红书纯净信息流与搜索</p>
      </div>
    </header>

    <main>
      <form id="search-form" class="popup-search">
        <label for="search-keyword">搜索小红书</label>
        <div class="search-row">
          <input id="search-keyword" type="search" placeholder="输入关键词" autocomplete="off" required />
          <button id="search-submit" type="submit">搜索</button>
        </div>
        <p id="search-error" class="search-error" role="status" hidden></p>
      </form>

      <div class="row">
        <span class="row-label">纯净信息流</span>
        <button id="toggle" class="toggle" type="button" role="switch" aria-checked="true" aria-label="纯净信息流">
          <span class="thumb"></span>
        </button>
      </div>
      <p class="status" id="status-text">已开启：按下方组件开关净化信息流。</p>

      <section class="card" id="components">
        <div class="card-head">
          <span class="card-title">分组件隐藏</span>
          <span class="card-sub">开关打开 = 隐藏该元素</span>
        </div>
        <div id="component-rows"></div>
      </section>

      <div id="feature-groups"></div>

      <p class="hint">小红书页面按 <kbd>/</kbd> 进入纯净搜索，按 <kbd>Esc</kbd> 返回。</p>
      <p class="hint">切换即时生效，无需刷新页面；快捷键 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd></p>
    </main>

    <script src="../shared.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
